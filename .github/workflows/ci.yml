name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The suite drives internal/fakeiterm over a unix socket rather than iTerm2
    # itself, so it runs on Linux. macOS is here because that is where users are,
    # and because the AppleScript path only compiles meaningfully there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        # gofmt -l prints files it would change, and exits 0 either way, so the
        # check is whether that list is empty.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  upstream:
    # Asks GitHub whether iTerm2's api.proto has moved. It reports maintenance
    # work rather than a broken pull request, so a drift does not block a merge:
    # the offline half of the check, that the pin matches the vendored file, runs
    # in the test job above and does gate merges.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check for upstream protocol drift
        env:
          CHECK_UPSTREAM_DRIFT: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: go test -run TestUpstream -v ./...
